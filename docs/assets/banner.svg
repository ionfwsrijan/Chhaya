<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Chhaya — shade as software for outdoor heat safety">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#3b1608"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#sky)"/>

  <!-- sun + glow -->
  <circle cx="1060" cy="96" r="220" fill="url(#glow)"/>
  <circle cx="1060" cy="96" r="64" fill="url(#sun)"/>

  <!-- heat bands (normal / caution / stop) -->
  <g transform="translate(1060,96)">
    <path d="M-150 150 A150 150 0 0 1 150 150" fill="none" stroke="#22c55e" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 314 0"/>
    <path d="M-150 150 A150 150 0 0 1 -20 6" fill="none" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="8" stroke-linecap="round"/>
    <path d="M-20 6 A150 150 0 0 1 150 150" fill="none" stroke="#ef4444" stroke-opacity="0.85" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- horizon lines -->
  <g stroke="#fecaca" stroke-opacity="0.18" stroke-width="1">
    <line x1="620" y1="230" x2="1280" y2="230"/>
    <line x1="700" y1="262" x2="1280" y2="262"/>
    <line x1="780" y1="294" x2="1280" y2="294"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="7">CHHAYA</text>
  <text x="76" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#fed7aa">Shade as software</text>
  <text x="78" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#fecaca">A site-level heat action plan that measures the hour, decides with two</text>
  <text x="78" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#fecaca">published standards, and stops work only on a human's exact phrase.</text>

  <!-- tag -->
  <g transform="translate(78,282)">
    <rect x="0" y="0" width="470" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="16" y="20" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffe4e6">WeMakeDevs · Environmental Hacks · Track 02 — Heat &amp; Water</text>
  </g>
</svg>
