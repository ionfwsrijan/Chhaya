[project]
name = "chhaya"
version = "0.1.0"
description = "Chhaya - site-level heat action plan for outdoor workers: decide, consent, execute, prove."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Chhaya" }]
keywords = ["heat-stress", "wbgt", "occupational-safety", "heat-action-plan", "aws"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
aws = ["mangum>=0.17"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[dynamodb,lambda,sfn,sts,sns,ses,scheduler,cloudwatch,iam,sqs,secretsmanager]>=1.34",
    "types-PyYAML>=6.0",
    "moto[dynamodb]>=5.0",
]

[project.scripts]
chhaya = "chhaya.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chhaya*"]

[tool.setuptools.package-data]
chhaya = ["policies/*.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:chhaya.*"]
markers = [
    "slow: tests that hit the network",
    "aws: tests that require AWS or moto",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG",
    "PTH", "T20", "PT", "RUF",
]
ignore = [
    "E501",
    "SIM108",
    "RUF001",
    "RUF002",
    "RUF003",
    "RET504",
    "B008",
    "PT011",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "ARG", "PT", "RUF015"]
"src/chhaya/handlers/*" = ["T20", "ARG"]
"src/chhaya/cli.py" = ["T20", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["chhaya"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
exclude = ["build/", "dist/", "web/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*", "strands.*", "tests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["chhaya"]
branch = true
omit = ["*/handlers/*", "*/cli.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
